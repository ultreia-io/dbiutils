          href: CODE_OF_CONDUCT.html
        - text: "---------"
        - text: Feature request
          href: https://github.com/ultreia-io/dbiutils/issues/new?template=feature-request.yml
        - text: Report a bug
          href: https://github.com/ultreia-io/dbiutils/issues/new?template=bug-report.yml
        - text: Report a vulnerability
