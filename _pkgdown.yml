url: https://ultreia-io.github.io/dbiutils/

template:
  bootstrap: 5
  light-switch: true

reference:
  - title: Query helpers
    desc: Execute DBI queries and load SQL statements from files.
  - contents:
      - db_query
      - read_sql_file
  - title: Connections
    desc: Create configured connections and safely manage their lifecycle.
  - contents:
      - db_connect_from_yaml
      - with_db_connection

articles:
  - title: Get started
    navbar: ~
    contents:
      - dbiutils

home:
